<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadAloud</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    background: #12141a; color: #e6e8ee;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 900px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #7ee787; }
  .sub { font-size: 12px; color: #8b93a5; margin-bottom: 16px; }
  textarea {
    width: 100%; min-height: 200px; resize: vertical;
    background: #1b1f28; color: #e6e8ee; border: 1px solid #2c3242;
    border-radius: 8px; padding: 12px; font-size: 15px; line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: #7ee787; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  button, select, label.filebtn {
    background: #232837; color: #e6e8ee; border: 1px solid #2c3242;
    border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer;
  }
  button:hover, label.filebtn:hover { border-color: #7ee787; }
  button.primary { background: #238636; border-color: #2ea043; font-weight: 600; }
  button.primary:disabled { opacity: .5; cursor: wait; }
  input[type=range] { accent-color: #7ee787; }
  .fileinfo { font-size: 12px; color: #8b93a5; }
  #scriptBox {
    margin-top: 18px; background: #1b1f28; border: 1px solid #2c3242;
    border-radius: 8px; padding: 14px; font-size: 16px; line-height: 1.6;
    white-space: pre-wrap; display: none;
  }
  #status { font-size: 13px; color: #d29922; min-height: 18px; margin-top: 8px; }
  #status.error { color: #f85149; }
  .drop { border-style: dashed; transition: border-color .15s; }
  .drop.over { border-color: #7ee787; }
  .small { font-size: 12px; color: #8b93a5; }
  progress { width: 100%; height: 6px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🗣️ ReadAloud</h1>
  <div class="sub">Paste text or drop an image/PDF → model cleans it → HeyGen speaks it. Model: <b>{{ model }}</b></div>

  {% if not has_key %}
  <div class="sub" style="color:#f85149">⚠ OPENROUTER_API_KEY not found — set it in readaloud/.env or ~/.secrets.local and restart.</div>
  {% endif %}

  <textarea id="input" class="drop" placeholder="Paste your text here… (or drop an image / PDF right onto this box)"></textarea>

  <div class="row">
    <button id="go" class="primary">▶ Prepare &amp; Speak</button>
    <label class="filebtn">📎 Attach file
      <input type="file" id="file" accept="image/*,.pdf,.txt,.md" hidden>
    </label>
    <span id="fileinfo" class="fileinfo"></span>
    <button id="clip" title="Paste from clipboard via permission API">📋 Paste</button>
  </div>

  <div class="row">
    <label class="small" for="engine">Speech engine</label>
    <select id="engine">
      <option value="heygen" selected>HeyGen Voice Turbo — real audio</option>
      <option value="browser">Browser voices</option>
    </select>
    <label class="small" id="ttsVoiceLabel" for="ttsVoice">HeyGen voice</label>
    <select id="ttsVoice" style="max-width: 220px">
      <option value="gareth" selected>Gareth</option>
    </select>
    <button id="testVoice">▶ Test voice</button>
  </div>

  <div class="row" id="browserControls">
    <span class="small">Voice</span>
    <select id="voice" style="max-width: 320px"></select>
    <span class="small">Rate</span>
    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" style="width:110px">
    <span class="small" id="rateval">1.0×</span>
    <span class="small">Pitch</span>
    <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1" style="width:90px">
  </div>

  <div class="row">
    <button id="pause">⏸ Pause</button>
    <button id="resume">▶ Resume</button>
    <button id="stop">⏹ Stop</button>
    <button id="skipPrev">⏮ Prev chunk</button>
    <button id="skipNext">⏭ Next chunk</button>
    <span class="small" id="chunkpos"></span>
  </div>

  <audio id="audioPlayer" controls hidden style="width:100%; margin-top:10px"></audio>

  <progress id="prog" indeterminate></progress>
  <div id="status"></div>
  <div id="scriptBox"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let attached = null;          // File object
let chunks = [];              // speakable sentences
let chunkIdx = 0;
let voices = [];
let ttsChunks = [];
let ttsChunkIdx = 0;
let preparedScript = "";
let audioUrl = null;
let pendingAudioBlob = null;
let playbackGeneration = 0;
let previewMode = false;
let paused = false;

function updateEngineUI() {
  const heygen = $("engine").value === "heygen";
  $("ttsVoiceLabel").style.display = heygen ? "inline" : "none";
  $("ttsVoice").style.display = heygen ? "inline-block" : "none";
  $("testVoice").style.display = heygen ? "inline-block" : "none";
  $("browserControls").style.display = heygen ? "none" : "flex";
  $("audioPlayer").hidden = !heygen || !$("audioPlayer").src;
}

async function loadTtsConfig() {
  try {
    const response = await fetch("/api/tts-config");
    if (!response.ok) return;
    const config = await response.json();
    if (!Array.isArray(config.voices) || !config.voices.length) return;
    const select = $("ttsVoice");
    select.innerHTML = "";
    for (const voice of config.voices) {
      const option = document.createElement("option");
      option.value = voice;
      option.textContent = voice.charAt(0).toUpperCase() + voice.slice(1);
      select.appendChild(option);
    }
    select.value = config.voice || "gareth";
  } catch {
  }
}

// ---------------- voices ----------------
function loadVoices() {
  voices = speechSynthesis.getVoices();
  const sel = $("voice");
  sel.innerHTML = "";
  // English voices first, then the rest
  const sorted = [...voices].sort((a, b) =>
    (/^en/i.test(a.lang) ? 0 : 1) - (/^en/i.test(b.lang) ? 0 : 1) ||
    a.name.localeCompare(b.name));
  for (const v of sorted) {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(opt);
  }
  const prefer = sorted.find(v => /en[-_]US.*(Natural|Online|Google)/i.test(v.name))
              || sorted.find(v => /^en/i.test(v.lang));
  if (prefer) sel.value = prefer.name;
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
loadTtsConfig();
updateEngineUI();

$("engine").onchange = () => {
  stopSpeech();
  updateEngineUI();
};

$("rate").oninput = () => $("rateval").textContent = Number($("rate").value).toFixed(1) + "×";

// ---------------- drag & drop ----------------
const ta = $("input");
["dragover","dragenter"].forEach(ev => ta.addEventListener(ev, e => {
  e.preventDefault(); ta.classList.add("over");
}));
["dragleave","drop"].forEach(ev => ta.addEventListener(ev, e => {
  e.preventDefault(); ta.classList.remove("over");
}));
ta.addEventListener("drop", e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) setFile(f);
});

$("file").onchange = (e) => { if (e.target.files[0]) setFile(e.target.files[0]); };
function setFile(f) {
  attached = f;
  $("fileinfo").textContent = `📄 ${f.name} (${(f.size/1024).toFixed(0)} KB)`;
}

$("clip").onclick = async () => {
  try {
    const txt = await navigator.clipboard.readText();
    if (txt) ta.value += (ta.value ? "\n" : "") + txt;
    ta.focus();
  } catch { setStatus("Clipboard read blocked by browser — use Ctrl+V in the box.", true); }
};

// ---------------- status ----------------
function setStatus(msg, isError) {
  const s = $("status");
  s.textContent = msg || "";
  s.className = isError ? "error" : "";
}

// ---------------- backend call ----------------
$("go").onclick = async () => {
  const text = ta.value.trim();
  if (!text && !attached) { setStatus("Nothing to read — paste text or attach a file.", true); return; }

  stopSpeech();
  $("go").disabled = true;
  $("prog").style.display = "block";
  setStatus("Sending to {{ model }}…");

  const fd = new FormData();
  fd.append("text", text);
  if (attached) fd.append("file", attached);

  try {
    const r = await fetch("/api/speak", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));

    $("scriptBox").style.display = "block";
    $("scriptBox").textContent = j.script;
    preparedScript = j.script;
    chunks = splitSentences(j.script);
    ttsChunks = splitTtsText(j.script);
    chunkIdx = 0;
    ttsChunkIdx = 0;
    paused = false;
    if ($("engine").value === "heygen") {
      setStatus(`Preparing ${ttsChunks.length} audio chunk(s) with HeyGen.`);
      playTtsFrom(0);
    } else {
      setStatus(`Speaking ${chunks.length} chunks (${j.model}).`);
      speakFrom(0);
    }
  } catch (err) {
    setStatus("Error: " + err.message, true);
  } finally {
    $("go").disabled = false;
    $("prog").style.display = "none";
  }
};

// ---------------- speech ----------------
function splitSentences(t) {
  // split on sentence ends, keep paragraphs readable
  const parts = t.replace(/\s+/g, " ")
                 .match(/[^.!?…]+[.!?…]*\s*/g) || [t];
  // merge tiny fragments into neighbours so prosody sounds natural
  const out = [];
  let buf = "";
  for (let p of parts.map(s => s.trim())) {
    if (!p) continue;
    buf = buf ? buf + " " + p : p;
    if (buf.length > 40) { out.push(buf); buf = ""; }
  }
  if (buf) { if (out.length && buf.length < 25) out[out.length-1] += " " + buf; else out.push(buf); }
  return out;
}

function currentVoice() {
  return voices.find(v => v.name === $("voice").value) || null;
}

function splitTtsText(text) {
  const words = text.match(/\S+/g) || [];
  const result = [];
  let current = "";
  for (const word of words) {
    for (let offset = 0; offset < word.length; offset += 4500) {
      const part = word.slice(offset, offset + 4500);
      if (current && current.length + part.length + 1 > 4500) {
        result.push(current);
        current = "";
      }
      current = current ? current + " " + part : part;
      if (offset + 4500 < word.length) {
        result.push(current);
        current = "";
      }
    }
  }
  if (current) result.push(current);
  return result;
}

async function requestTts(text, voice) {
  const response = await fetch("/api/tts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, voice }),
  });
  if (!response.ok) {
    let message = "HTTP " + response.status;
    try { message = (await response.json()).error || message; } catch {}
    throw new Error(message);
  }
  return response.blob();
}

function setAudioBlob(blob) {
  const player = $("audioPlayer");
  if (audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = URL.createObjectURL(blob);
  player.src = audioUrl;
  player.hidden = false;
}

async function startAudio(blob, generation, isPreview) {
  setAudioBlob(blob);
  const player = $("audioPlayer");
  player.onended = () => {
    if (isPreview) {
      setStatus("Voice preview complete.");
    } else if (!paused && generation === playbackGeneration) {
      playTtsFrom(ttsChunkIdx + 1, generation);
    }
  };
  await player.play();
}

async function playTtsFrom(index, generation = playbackGeneration) {
  if (index >= ttsChunks.length) {
    setStatus("HeyGen playback complete.");
    return;
  }
  ttsChunkIdx = index;
  chunkPos();
  try {
    setStatus(`Generating HeyGen audio (${index + 1}/${ttsChunks.length})…`);
    const blob = await requestTts(ttsChunks[index], $("ttsVoice").value || "gareth");
    if (generation !== playbackGeneration) return;
    if (paused) {
      pendingAudioBlob = blob;
      return;
    }
    await startAudio(blob, generation, false);
    setStatus(`Playing HeyGen audio (${index + 1}/${ttsChunks.length}).`);
  } catch (error) {
    if (generation !== playbackGeneration) return;
    if (previewMode) {
      setStatus("Voice test failed: " + error.message, true);
      return;
    }
    $("engine").value = "browser";
    updateEngineUI();
    chunks = splitSentences(preparedScript);
    setStatus("HeyGen failed; falling back to browser speech: " + error.message, true);
    speakFrom(0);
  }
}

function speakFrom(i) {
  if (i >= chunks.length) { chunkPos(); return; }
  chunkIdx = i;
  chunkPos();
  const utterance = new SpeechSynthesisUtterance(chunks[i]);
  const voice = currentVoice();
  if (voice) { utterance.voice = voice; utterance.lang = voice.lang; }
  utterance.rate = Number($("rate").value);
  utterance.pitch = Number($("pitch").value);
  utterance.onend = () => { if (!paused) speakFrom(chunkIdx + 1); };
  utterance.onerror = (event) => {
    if (event.error !== "interrupted" && event.error !== "canceled")
      setStatus("Speech error: " + event.error, true);
  };
  speechSynthesis.speak(utterance);
}

$("testVoice").onclick = async () => {
  stopSpeech();
  const generation = playbackGeneration;
  previewMode = true;
  $("testVoice").disabled = true;
  setStatus("Generating voice preview…");
  try {
    const blob = await requestTts(
      "Hello! This is a preview of the selected ReadAloud voice.",
      $("ttsVoice").value || "gareth");
    if (generation !== playbackGeneration) return;
    await startAudio(blob, generation, true);
    setStatus("Playing voice preview.");
  } catch (error) {
    if (generation === playbackGeneration) {
      previewMode = false;
      setStatus("Voice test failed: " + error.message, true);
    }
  } finally {
    $("testVoice").disabled = false;
  }
};

$("pause").onclick = () => {
  paused = true;
  if ($("engine").value === "heygen") $("audioPlayer").pause();
  else speechSynthesis.pause();
};
$("resume").onclick = () => {
  if ($("engine").value === "heygen") {
    paused = false;
    if (pendingAudioBlob) {
      const blob = pendingAudioBlob;
      pendingAudioBlob = null;
      startAudio(blob, playbackGeneration, previewMode).catch(error =>
        setStatus("Audio playback failed: " + error.message, true));
    } else if ($("audioPlayer").ended) {
      playTtsFrom(ttsChunkIdx + 1);
    } else if ($("audioPlayer").src) {
      $("audioPlayer").play().catch(error =>
        setStatus("Audio playback failed: " + error.message, true));
    } else {
      playTtsFrom(ttsChunkIdx);
    }
  } else if (paused) {
    paused = false;
    speechSynthesis.resume();
  } else {
    speakFrom(chunkIdx);
  }
};
$("stop").onclick = stopSpeech;
$("skipNext").onclick = () => {
  const next = $("engine").value === "heygen"
    ? Math.min(ttsChunkIdx + 1, ttsChunks.length - 1)
    : Math.min(chunkIdx + 1, chunks.length - 1);
  stopSpeech();
  if ($("engine").value === "heygen") playTtsFrom(next);
  else speakFrom(next);
};
$("skipPrev").onclick = () => {
  const previous = $("engine").value === "heygen"
    ? Math.max(ttsChunkIdx - 1, 0)
    : Math.max(chunkIdx - 1, 0);
  stopSpeech();
  if ($("engine").value === "heygen") playTtsFrom(previous);
  else speakFrom(previous);
};

function stopSpeech() {
  paused = false;
  previewMode = false;
  pendingAudioBlob = null;
  playbackGeneration += 1;
  speechSynthesis.cancel();
  const player = $("audioPlayer");
  player.pause();
  player.removeAttribute("src");
  player.load();
  if (audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = null;
  player.hidden = $("engine").value !== "heygen";
}

function chunkPos() {
  const usingTts = $("engine").value === "heygen";
  const total = usingTts ? ttsChunks.length : chunks.length;
  const index = usingTts ? ttsChunkIdx : chunkIdx;
  $("chunkpos").textContent = total ? `${Math.min(index + 1, total)} / ${total}` : "";
}

// Chrome bug: long speech stops after ~15s unless you nudge it
setInterval(() => {
  if (!speechSynthesis.paused && speechSynthesis.speaking) {
    speechSynthesis.pause(); speechSynthesis.resume();
  }
}, 10000);
</script>
</body>
</html>
